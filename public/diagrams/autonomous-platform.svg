<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 480" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed" />
    </marker>
    
    <!-- Soft Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1060" height="480" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Diagram Title / Header Area -->
  <g transform="translate(36, 36)">
    <circle cx="6" cy="6" r="4" fill="#2563eb"/>
    <text x="18" y="10" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">SYSTEM TOPOLOGY &amp; DATA FLOW</text>
  </g>

  <!-- 1. FEED INGESTION BOX -->
  <g transform="translate(36, 75)" filter="url(#card-shadow)">
    <rect width="210" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="210" height="34" rx="10" fill="#f1f5f9"/>
    <path d="M 0 24 L 0 34 L 210 34 L 210 24 Z" fill="#f1f5f9"/>
    <circle cx="18" cy="17" r="4" fill="#3b82f6"/>
    <text x="30" y="21" font-size="11" font-weight="700" fill="#334155">LIVE DATA INGESTION</text>
    
    <text x="16" y="60" font-size="13" font-weight="700" fill="#0f172a">WebSocket Stream</text>
    <text x="16" y="80" font-size="11" fill="#64748b">Asynchronous client feeds</text>
    <text x="16" y="98" font-size="11" fill="#64748b">Non-blocking tick ingestion</text>

    <!-- Tag -->
    <rect x="16" y="115" width="125" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="24" y="129" font-size="10" font-weight="600" fill="#1d4ed8">Python asyncio</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <path d="M 246 150 L 290 150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="250" y="142" font-size="9" font-weight="600" fill="#64748b">&lt;1ms</text>

  <!-- 2. CONCURRENCY ENGINE & RING BUFFERS -->
  <g transform="translate(296, 75)" filter="url(#card-shadow)">
    <rect width="220" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="220" height="34" rx="10" fill="#f1f5f9"/>
    <path d="M 0 24 L 0 34 L 220 34 L 220 24 Z" fill="#f1f5f9"/>
    <circle cx="18" cy="17" r="4" fill="#2563eb"/>
    <text x="30" y="21" font-size="11" font-weight="700" fill="#334155">CONCURRENCY &amp; RAM</text>
    
    <text x="16" y="60" font-size="13" font-weight="700" fill="#0f172a">In-Memory Buffers</text>
    <text x="16" y="80" font-size="11" fill="#64748b">Circular arrays for VWAP</text>
    <text x="16" y="98" font-size="11" fill="#64748b">Rolling volatility &amp; metrics</text>

    <!-- Tag -->
    <rect x="16" y="115" width="135" height="20" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="24" y="129" font-size="10" font-weight="600" fill="#15803d">Zero Cache Latency</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <path d="M 516 150 L 558 150" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- 3. FINITE STATE MACHINE (ACID PERSISTENCE) -->
  <g transform="translate(564, 75)" filter="url(#card-shadow)">
    <rect width="220" height="150" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="220" height="34" rx="10" fill="#eff6ff"/>
    <path d="M 0 24 L 0 34 L 220 34 L 220 24 Z" fill="#eff6ff"/>
    <circle cx="18" cy="17" r="4" fill="#2563eb"/>
    <text x="30" y="21" font-size="11" font-weight="700" fill="#1d4ed8">ATOMIC STATE MACHINE</text>
    
    <text x="16" y="60" font-size="13" font-weight="700" fill="#0f172a">SQLite WAL Engine</text>
    <text x="16" y="80" font-size="11" fill="#64748b">Atomic state transitions</text>
    <text x="16" y="98" font-size="11" fill="#64748b">Zero-orphan hot recovery</text>

    <!-- Tag -->
    <rect x="16" y="115" width="145" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="24" y="129" font-size="10" font-weight="600" fill="#1e40af">ACID Crash Resilient</text>
  </g>

  <!-- Flow Connector 3 -> 4 (Right) -->
  <path d="M 784 150 L 828 150" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- 4. DYNAMIC EXECUTION & ROUTING -->
  <g transform="translate(834, 75)" filter="url(#card-shadow)">
    <rect width="190" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="190" height="34" rx="10" fill="#f1f5f9"/>
    <path d="M 0 24 L 0 34 L 190 34 L 190 24 Z" fill="#f1f5f9"/>
    <circle cx="18" cy="17" r="4" fill="#10b981"/>
    <text x="30" y="21" font-size="11" font-weight="700" fill="#334155">EXECUTION &amp; API</text>
    
    <text x="16" y="60" font-size="13" font-weight="700" fill="#0f172a">Dynamic Walker</text>
    <text x="16" y="80" font-size="11" fill="#64748b">Queue-priority pricing</text>
    <text x="16" y="98" font-size="11" fill="#64748b">Fail-safe circuit breakers</text>

    <!-- Tag -->
    <rect x="16" y="115" width="130" height="20" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="24" y="129" font-size="10" font-weight="600" fill="#047857">REST / Broker APIs</text>
  </g>

  <!-- Downward Connectors to Lower Layer -->
  <!-- Connector 3 down to Shadow Staging -->
  <path d="M 674 225 L 674 275" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-purple)"/>
  <text x="682" y="255" font-size="10" font-weight="600" fill="#7c3aed">Fork stream</text>

  <!-- Connector 3 down & right to Telemetry -->
  <path d="M 720 225 L 720 255 L 430 255 L 430 275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. SHADOW STAGING (CANARY DAEMON) -->
  <g transform="translate(564, 285)" filter="url(#card-shadow)">
    <rect width="220" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="220" height="34" rx="10" fill="#faf5ff"/>
    <path d="M 0 24 L 0 34 L 220 34 L 220 24 Z" fill="#faf5ff"/>
    <circle cx="18" cy="17" r="4" fill="#7c3aed"/>
    <text x="30" y="21" font-size="11" font-weight="700" fill="#6b21a8">ISOLATED STAGING</text>
    
    <text x="16" y="60" font-size="13" font-weight="700" fill="#0f172a">Shadow Incubator</text>
    <text x="16" y="80" font-size="11" fill="#64748b">Forward-test experimental models</text>
    <text x="16" y="98" font-size="11" fill="#64748b">Real-time live tick evaluation</text>

    <!-- Tag -->
    <rect x="16" y="115" width="145" height="20" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="24" y="129" font-size="10" font-weight="600" fill="#6d28d9">Linux systemd Daemon</text>
  </g>

  <!-- 6. OBSERVABILITY & GENAI PIPELINE -->
  <g transform="translate(196, 285)" filter="url(#card-shadow)">
    <rect width="320" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="320" height="34" rx="10" fill="#f1f5f9"/>
    <path d="M 0 24 L 0 34 L 320 34 L 320 24 Z" fill="#f1f5f9"/>
    <circle cx="18" cy="17" r="4" fill="#ea580c"/>
    <text x="30" y="21" font-size="11" font-weight="700" fill="#334155">OBSERVABILITY &amp; INCIDENT AI</text>
    
    <text x="16" y="60" font-size="13" font-weight="700" fill="#0f172a">Prometheus &amp; Google Gemini API</text>
    <text x="16" y="80" font-size="11" fill="#64748b">Embedded HTTP /metrics exporter (&lt;5MB RAM)</text>
    <text x="16" y="98" font-size="11" fill="#64748b">NumPy 4D vector cosine distance + Gemini 3.8 Flash</text>

    <!-- Tags -->
    <rect x="16" y="115" width="125" height="20" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="24" y="129" font-size="10" font-weight="600" fill="#c2410c">Prometheus :9108</text>

    <rect x="150" y="115" width="150" height="20" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="158" y="129" font-size="10" font-weight="600" fill="#b91c1c">gemini-3.8-flash AI</text>
  </g>

  <!-- Connector from Shadow & Execution to Telemetry -->
  <path d="M 564 360 L 522 360" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
</svg>
